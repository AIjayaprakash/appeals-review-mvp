[project]
name = "appeals-review-mvp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "chromadb>=0.5",
    "openai>=1.50",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "langgraph>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
